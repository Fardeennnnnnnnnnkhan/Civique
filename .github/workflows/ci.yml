name: Civique CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: civique-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: civique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civique_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/civique_test
      DIRECT_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/civique_test
      JWT_ACCESS_SECRET: ci_only_access_secret_with_more_than_32_characters
      JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters
      CORS_ORIGINS: http://127.0.0.1:3000
      REQUIRE_STORAGE_READY: "false"
      AI_ANALYSIS_ENABLED: "false"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=services/api

      - name: Apply migrations to isolated database
        run: npx prisma migrate deploy --schema services/api/prisma/schema.prisma

      - name: Run unit tests
        run: npm test

      - name: Run durable queue integration tests
        run: npm run test:integration:queue --workspace=services/worker

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint workspaces
        run: npm run lint

      - name: Build API
        run: npm run build:api

      - name: Build worker
        run: npm run build:worker

      - name: Build web
        run: npm run build:web

      - name: Compile-check Python service
        run: python -m compileall -q services/ml/app
